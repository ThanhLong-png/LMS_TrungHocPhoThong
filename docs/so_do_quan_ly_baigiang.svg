<svg xmlns="http://www.w3.org/2000/svg" width="660" height="620" viewBox="0 0 660 620">
  <defs>
    <!-- Arrow marker definition -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333" />
    </marker>
  </defs>

  <!-- Outer frame with rounded corners -->
  <rect x="10" y="10" width="640" height="600" rx="15" ry="15" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" />

  <!-- Yellow vertical header column on the left -->
  <path d="M 60 10 L 25 10 A 15 15 0 0 0 10 25 L 10 595 A 15 15 0 0 0 25 610 L 60 610 Z" fill="#FFF9C4" stroke="#333333" stroke-width="1.5" />

  <!-- Horizontal division lines for swimlanes -->
  <line x1="10" y1="210" x2="650" y2="210" stroke="#333333" stroke-width="1.5" />
  <line x1="10" y1="410" x2="650" y2="410" stroke="#333333" stroke-width="1.5" />

  <!-- Vertical text labels inside the yellow header column -->
  <text transform="rotate(-90, 35, 110)" x="35" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333" font-weight="bold">Giáo viên</text>
  <text transform="rotate(-90, 35, 310)" x="35" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333" font-weight="bold">Học sinh</text>
  <text transform="rotate(-90, 35, 510)" x="35" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333" font-weight="bold">Hệ thống</text>

  <!-- ==================== LANE 1: GIÁO VIÊN (y: 10 to 210) ==================== -->
  
  <!-- Start Node (Black circle) -->
  <circle cx="120" cy="50" r="10" fill="#000000" />

  <!-- Diamond: Chọn hành động? -->
  <polygon points="180,40 195,50 180,60 165,50" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="180" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#000000">Chọn hành động?</text>

  <!-- Box 1: Soạn bài giảng & tải tài liệu -->
  <rect x="110" y="90" width="150" height="45" rx="5" ry="5" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="185" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000">
    <tspan x="185" dy="0">Soạn bài giảng &amp;</tspan>
    <tspan x="185" dy="13">tải tài liệu học tập</tspan>
  </text>

  <!-- Box 2: Viết bình luận / Phản hồi -->
  <rect x="350" y="90" width="150" height="45" rx="5" ry="5" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="425" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000">
    <tspan x="425" dy="0">Viết bình luận /</tspan>
    <tspan x="425" dy="13">Trả lời phản hồi</tspan>
  </text>


  <!-- ==================== LANE 2: HỌC SINH (y: 210 to 410) ==================== -->

  <!-- Start Node (Black circle) -->
  <circle cx="120" cy="250" r="10" fill="#000000" />

  <!-- Diamond: Chọn hành động? -->
  <polygon points="180,240 195,250 180,260 165,250" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="180" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#000000">Chọn hành động?</text>

  <!-- Box 1: Xem bài giảng & tải tài liệu -->
  <rect x="110" y="290" width="150" height="45" rx="5" ry="5" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="185" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000">
    <tspan x="185" dy="0">Xem bài giảng &amp;</tspan>
    <tspan x="185" dy="13">tải tài liệu học tập</tspan>
  </text>

  <!-- Box 2: Viết bình luận / Phản hồi -->
  <rect x="350" y="290" width="150" height="45" rx="5" ry="5" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="425" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000">
    <tspan x="425" dy="0">Viết bình luận /</tspan>
    <tspan x="425" dy="13">Trả lời phản hồi</tspan>
  </text>

  <!-- End Node (Black circle with outer border) -->
  <circle cx="570" cy="330" r="10" fill="#000000" />
  <circle cx="570" cy="330" r="15" fill="none" stroke="#000000" stroke-width="1.5" />


  <!-- ==================== LANE 3: HỆ THỐNG (y: 410 to 610) ==================== -->

  <!-- Box 1: Lưu bài giảng & phân loại tài liệu -->
  <rect x="110" y="440" width="150" height="45" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="185" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
    <tspan x="185" dy="0">Lưu bài giảng &amp;</tspan>
    <tspan x="185" dy="13">phân loại tài liệu</tspan>
  </text>

  <!-- Box 2: Lưu bình luận & cập nhật Feed -->
  <rect x="350" y="440" width="150" height="45" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="425" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
    <tspan x="425" dy="0">Lưu bình luận &amp;</tspan>
    <tspan x="425" dy="13">cập nhật hiển thị Feed</tspan>
  </text>


  <!-- ==================== CONNECTIONS / FLOWS ==================== -->

  <!-- Giáo viên Start to Diamond -->
  <path d="M 130 50 L 165 50" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  
  <!-- Giáo viên Diamond to Box 1 -->
  <path d="M 180 60 L 180 90" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="184" y="78" font-family="Arial, sans-serif" font-size="8.5" fill="#1565C0" font-weight="bold">Đăng bài</text>

  <!-- Giáo viên Diamond to Box 2 -->
  <path d="M 195 50 L 425 50 L 425 90" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="310" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#1565C0" font-weight="bold">Bình luận</text>


  <!-- Học sinh Start to Diamond -->
  <path d="M 130 250 L 165 250" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  
  <!-- Học sinh Diamond to Box 1 -->
  <path d="M 180 260 L 180 290" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="184" y="278" font-family="Arial, sans-serif" font-size="8.5" fill="#2E7D32" font-weight="bold">Xem bài</text>

  <!-- Học sinh Diamond to Box 2 -->
  <path d="M 195 250 L 425 250 L 425 290" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="310" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#2E7D32" font-weight="bold">Bình luận</text>


  <!-- GV Box 1 -> Hệ thống Box 1 (via left corridor) -->
  <path d="M 185 135 L 185 150 L 80 150 L 80 462 L 110 462" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  
  <!-- Hệ thống Box 1 -> HS Box 1 -->
  <path d="M 185 440 L 185 335" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />


  <!-- GV Box 2 -> Hệ thống Box 2 (via right corridor) -->
  <path d="M 425 135 L 425 150 L 520 150 L 520 462 L 500 462" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- HS Box 2 -> Hệ thống Box 2 -->
  <path d="M 425 290 L 425 440" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />


  <!-- ==================== COLLECTOR & END NODE ==================== -->
  
  <!-- HS Box 1 to Join Bar (via left corridor x=90) -->
  <path d="M 185 335 L 185 350 L 90 350 L 90 537" fill="none" stroke="#333333" stroke-width="1.2" />

  <!-- System Box 2 to Join Bar -->
  <path d="M 425 485 L 425 537" fill="none" stroke="#333333" stroke-width="1.2" />

  <!-- Join Bar -->
  <line x1="80" y1="540" x2="490" y2="540" stroke="#000000" stroke-width="6" stroke-linecap="round" />

  <!-- Join Bar to End Node -->
  <path d="M 490 540 L 570 540 L 570 345" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

</svg>
