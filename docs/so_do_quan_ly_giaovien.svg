<svg xmlns="http://www.w3.org/2000/svg" width="880" height="750" viewBox="0 0 880 750">
  <defs>
    <!-- Arrow marker definition -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333" />
    </marker>
  </defs>

  <!-- Outer frame with rounded corners -->
  <rect x="10" y="10" width="860" height="730" rx="15" ry="15" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" />

  <!-- Yellow vertical header column on the left -->
  <path d="M 60 10 L 25 10 A 15 15 0 0 0 10 25 L 10 725 A 15 15 0 0 0 25 740 L 60 740 Z" fill="#FFF9C4" stroke="#333333" stroke-width="1.5" />

  <!-- Horizontal division lines for swimlanes -->
  <line x1="10" y1="260" x2="870" y2="260" stroke="#333333" stroke-width="1.5" />

  <!-- Vertical text labels inside the yellow header column -->
  <text transform="rotate(-90, 35, 135)" x="35" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333" font-weight="bold">Admin / Ban giám hiệu</text>
  <text transform="rotate(-90, 35, 500)" x="35" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333" font-weight="bold">Hệ thống</text>

  <!-- ==================== LANE 1: ADMIN (y: 10 to 260) ==================== -->
  
  <!-- Start Node (Black circle) -->
  <circle cx="120" cy="50" r="10" fill="#000000" />

  <!-- Diamond: Chọn tác vụ? -->
  <polygon points="185,40 200,50 185,60 170,50" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="185" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#000000">Chọn tác vụ?</text>

  <!-- Box 1: Thêm giáo viên -->
  <rect x="70" y="100" width="150" height="45" rx="5" ry="5" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="145" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000">
    <tspan x="145" dy="0">Thêm giáo viên</tspan>
    <tspan x="145" dy="13">(Mã sinh tự động)</tspan>
  </text>

  <!-- Box 2: Cập nhật giáo viên -->
  <rect x="285" y="100" width="150" height="45" rx="5" ry="5" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="360" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000">
    <tspan x="360" dy="0">Cập nhật thông tin</tspan>
    <tspan x="360" dy="13">giáo viên</tspan>
  </text>

  <!-- Box 3: Xóa giáo viên -->
  <rect x="495" y="100" width="150" height="45" rx="5" ry="5" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="570" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000">
    <tspan x="570" dy="0">Xóa giáo viên</tspan>
    <tspan x="570" dy="13">(Dọn dẹp lịch dạy/lớp)</tspan>
  </text>

  <!-- Box 4: Khóa/Mở tài khoản -->
  <rect x="675" y="100" width="150" height="45" rx="5" ry="5" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="750" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000">
    <tspan x="750" dy="0">Khóa / Mở tài khoản</tspan>
    <tspan x="750" dy="13">giáo viên</tspan>
  </text>


  <!-- ==================== LANE 2: HỆ THỐNG (y: 260 to 740) ==================== -->

  <!-- === COLUMN 1: ADD TEACHER === -->
  <!-- HT Box 1.1: Sinh mã giáo viên -->
  <rect x="70" y="290" width="150" height="45" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="145" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
    <tspan x="145" dy="0">Tự sinh mã giáo viên</tspan>
    <tspan x="145" dy="13">dạng GVxxxx</tspan>
  </text>

  <!-- HT Box 1.2: Tạo Account -->
  <rect x="70" y="365" width="150" height="45" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="145" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
    <tspan x="145" dy="0">Tạo tài khoản &amp;</tspan>
    <tspan x="145" dy="13">gán vai trò GiaoVien</tspan>
  </text>

  <!-- HT Box 1.3: Phân GVCN -->
  <rect x="70" y="440" width="150" height="45" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="145" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
    <tspan x="145" dy="0">Phân công giáo viên</tspan>
    <tspan x="145" dy="13">chủ nhiệm (nếu chọn)</tspan>
  </text>

  <!-- HT Box 1.4: Phân công môn dạy -->
  <rect x="70" y="515" width="150" height="45" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="145" y="533" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#0d47a1">
    <tspan x="145" dy="0">Tạo MonHocGiaoVien</tspan>
    <tspan x="145" dy="13">cho các lớp được gán</tspan>
  </text>


  <!-- === COLUMN 2: UPDATE TEACHER === -->
  <!-- HT Box 2.1: Cập nhật CSDL -->
  <rect x="285" y="290" width="150" height="45" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="360" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
    <tspan x="360" dy="0">Cập nhật thông tin</tspan>
    <tspan x="360" dy="13">hồ sơ trong Users</tspan>
  </text>

  <!-- HT Box 2.2: Thu hồi GVCN cũ -->
  <rect x="285" y="365" width="150" height="45" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="360" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
    <tspan x="360" dy="0">Thu hồi lớp chủ</tspan>
    <tspan x="360" dy="13">nhiệm cũ (nếu có)</tspan>
  </text>

  <!-- HT Box 2.3: Gán GVCN mới -->
  <rect x="285" y="440" width="150" height="45" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="360" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
    <tspan x="360" dy="0">Gán giáo viên chủ</tspan>
    <tspan x="360" dy="13">nhiệm lớp mới được chọn</tspan>
  </text>


  <!-- === COLUMN 3: DELETE TEACHER === -->
  <!-- HT Box 3.1: Xóa phân công môn -->
  <rect x="495" y="290" width="150" height="45" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="570" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#0d47a1">
    <tspan x="570" dy="0">Xóa các phân công dạy</tspan>
    <tspan x="570" dy="13">(MonHocGiaoVien)</tspan>
  </text>

  <!-- HT Box 3.2: Xóa lịch dạy -->
  <rect x="495" y="365" width="150" height="45" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="570" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#0d47a1">
    <tspan x="570" dy="0">Xóa lịch giảng dạy</tspan>
    <tspan x="570" dy="13">(LichHoc)</tspan>
  </text>

  <!-- HT Box 3.3: Giải phóng GVCN -->
  <rect x="495" y="440" width="150" height="45" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="570" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
    <tspan x="570" dy="0">Gỡ thông tin GVCN</tspan>
    <tspan x="570" dy="13">ở các lớp đang quản lý</tspan>
  </text>

  <!-- HT Box 3.4: Xóa Users -->
  <rect x="495" y="515" width="150" height="45" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="570" y="533" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
    <tspan x="570" dy="0">Xóa tài khoản giáo</tspan>
    <tspan x="570" dy="13">viên khỏi bảng Users</tspan>
  </text>


  <!-- === COLUMN 4: TOGGLE ACTIVE === -->
  <!-- HT Box 4.1: Đổi trạng thái IsActive -->
  <rect x="675" y="290" width="150" height="45" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="750" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
    <tspan x="750" dy="0">Cập nhật trường</tspan>
    <tspan x="750" dy="13">IsActive tài khoản</tspan>
  </text>


  <!-- End Node (Black circle with outer border) -->
  <circle cx="830" cy="380" r="10" fill="#000000" />
  <circle cx="830" cy="380" r="15" fill="none" stroke="#000000" stroke-width="1.5" />


  <!-- ==================== CONNECTIONS / FLOWS ==================== -->

  <!-- Start to Diamond -->
  <path d="M 130 50 L 170 50" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Diamond to Box 1 -->
  <path d="M 185 60 L 185 100" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="189" y="80" font-family="Arial, sans-serif" font-size="8.5" fill="#1565C0" font-weight="bold">Thêm mới</text>

  <!-- Diamond to Box 2 -->
  <path d="M 200 50 L 360 50 L 360 100" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="280" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#1565C0" font-weight="bold">Cập nhật</text>

  <!-- Diamond to Box 3 -->
  <path d="M 200 50 L 570 50 L 570 100" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="485" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#1565C0" font-weight="bold">Xóa GV</text>

  <!-- Diamond to Box 4 -->
  <path d="M 200 50 L 750 50 L 750 100" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="662" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#1565C0" font-weight="bold">Khóa/Mở</text>


  <!-- === COLUMN 1 FLOWS === -->
  <!-- Box 1 -> HT Box 1.1 -->
  <path d="M 145 145 L 145 290" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- HT Box 1.1 -> HT Box 1.2 -->
  <path d="M 145 335 L 145 365" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- HT Box 1.2 -> HT Box 1.3 -->
  <path d="M 145 410 L 145 440" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- HT Box 1.3 -> HT Box 1.4 -->
  <path d="M 145 485 L 145 515" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- HT Box 1.4 to Join Bar -->
  <path d="M 145 560 L 145 657" fill="none" stroke="#333333" stroke-width="1.2" />


  <!-- === COLUMN 2 FLOWS === -->
  <!-- Box 2 -> HT Box 2.1 -->
  <path d="M 360 145 L 360 290" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- HT Box 2.1 -> HT Box 2.2 -->
  <path d="M 360 335 L 360 365" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- HT Box 2.2 -> HT Box 2.3 -->
  <path d="M 360 410 L 360 440" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- HT Box 2.3 to Join Bar -->
  <path d="M 360 485 L 360 657" fill="none" stroke="#333333" stroke-width="1.2" />


  <!-- === COLUMN 3 FLOWS === -->
  <!-- Box 3 -> HT Box 3.1 -->
  <path d="M 570 145 L 570 290" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- HT Box 3.1 -> HT Box 3.2 -->
  <path d="M 570 335 L 570 365" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- HT Box 3.2 -> HT Box 3.3 -->
  <path d="M 570 410 L 570 440" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- HT Box 3.3 -> HT Box 3.4 -->
  <path d="M 570 485 L 570 515" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- HT Box 3.4 to Join Bar -->
  <path d="M 570 560 L 570 657" fill="none" stroke="#333333" stroke-width="1.2" />


  <!-- === COLUMN 4 FLOWS === -->
  <!-- Box 4 -> HT Box 4.1 -->
  <path d="M 750 145 L 750 290" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- HT Box 4.1 to Join Bar -->
  <path d="M 750 335 L 750 657" fill="none" stroke="#333333" stroke-width="1.2" />


  <!-- ==================== COLLECTOR & END NODE ==================== -->

  <!-- Join Bar (UML Fork/Join Bar) -->
  <line x1="100" y1="660" x2="780" y2="660" stroke="#000000" stroke-width="6" stroke-linecap="round" />

  <!-- Join Bar to End Node -->
  <path d="M 780 660 L 830 660 L 830 395" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

</svg>
