<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="740" viewBox="0 0 1250 740">
  <defs>
    <!-- Arrow marker definition -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333" />
    </marker>
  </defs>

  <!-- Outer frame with rounded corners -->
  <rect x="10" y="10" width="1230" height="720" rx="15" ry="15" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" />

  <!-- Yellow vertical header column on the left -->
  <path d="M 60 10 L 25 10 A 15 15 0 0 0 10 25 L 10 715 A 15 15 0 0 0 25 730 L 60 730 Z" fill="#FFF9C4" stroke="#333333" stroke-width="1.5" />

  <!-- Horizontal division lines for swimlanes -->
  <line x1="10" y1="340" x2="1240" y2="340" stroke="#333333" stroke-width="1.5" />

  <!-- Vertical text labels inside the yellow header column -->
  <text transform="rotate(-90, 35, 175)" x="35" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333333" font-weight="bold">Admin / Hiệu trưởng</text>
  <text transform="rotate(-90, 35, 540)" x="35" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333333" font-weight="bold">Hệ thống</text>

  <!-- ==================== LANE 1: ADMIN / HIỆU TRƯỞNG (y: 10 to 340) ==================== -->
  
  <!-- Start Node (Black circle) -->
  <circle cx="90" cy="70" r="10" fill="#000000" />

  <!-- Diamond: Chọn đối tượng? -->
  <text x="170" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#000000">Chọn đối tượng?</text>
  <polygon points="170,55 190,70 170,85 150,70" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />

  <!-- === COLUMN 1: TÀI KHOẢN CHUNG === -->
  <!-- Diamond: Hành động tài khoản? -->
  <text x="170" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000">Hành động?</text>
  <polygon points="170,125 190,140 170,155 150,140" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />

  <!-- Box: Tạo tài khoản -->
  <rect x="80" y="180" width="100" height="45" rx="5" ry="5" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="130" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000">
    <tspan x="130" dy="0">Tạo tài khoản</tspan>
    <tspan x="130" dy="13">&amp; gán vai trò</tspan>
  </text>

  <!-- Box: Sửa vai trò/Xóa -->
  <rect x="210" y="180" width="100" height="45" rx="5" ry="5" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="260" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000">
    <tspan x="260" dy="0">Sửa vai trò</tspan>
    <tspan x="260" dy="13">hoặc Xóa</tspan>
  </text>

  <!-- End Node (Black circle with outer border in clear column x=325) -->
  <circle cx="325" cy="300" r="10" fill="#000000" />
  <circle cx="325" cy="300" r="15" fill="none" stroke="#000000" stroke-width="1.5" />

  <!-- === COLUMN 2: GIÁO VIÊN === -->
  <!-- Diamond: Hành động GV? -->
  <text x="485" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000">Hành động?</text>
  <polygon points="485,125 505,140 485,155 465,140" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />

  <!-- Box: Thêm Giáo viên -->
  <rect x="340" y="180" width="100" height="45" rx="5" ry="5" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="390" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000">
    <tspan x="390" dy="0">Thêm Giáo viên</tspan>
    <tspan x="390" dy="13">(Nhập thông tin)</tspan>
  </text>

  <!-- Box: Sửa/Khóa GV -->
  <rect x="435" y="240" width="100" height="45" rx="5" ry="5" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="485" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000">
    <tspan x="485" dy="0">Sửa thông tin</tspan>
    <tspan x="485" dy="13">hoặc Khóa tài khoản</tspan>
  </text>

  <!-- Box: Xóa Giáo viên -->
  <rect x="530" y="180" width="100" height="45" rx="5" ry="5" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="580" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000">
    <tspan x="580" dy="0">Yêu cầu xóa</tspan>
    <tspan x="580" dy="13">Giáo viên</tspan>
  </text>

  <!-- === COLUMN 3: HỌC SINH === -->
  <!-- Diamond: Hành động HS? -->
  <text x="945" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000">Hành động?</text>
  <polygon points="945,80 965,95 945,110 925,95" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />

  <!-- Diamond: Phương thức thêm HS? -->
  <text x="830" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#000000">Phương thức?</text>
  <polygon points="830,115 850,130 830,145 810,130" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />

  <!-- Box: Thêm HS thủ công -->
  <rect x="720" y="170" width="90" height="45" rx="5" ry="5" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="765" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000">
    <tspan x="765" dy="0">Thêm thủ công</tspan>
    <tspan x="765" dy="13">(Nhập thông tin)</tspan>
  </text>

  <!-- Box: Import Excel -->
  <rect x="850" y="170" width="90" height="45" rx="5" ry="5" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="895" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000">
    <tspan x="895" dy="0">Import Excel</tspan>
    <tspan x="895" dy="13">(Upload file)</tspan>
  </text>

  <!-- Diamond: Thao tác chỉnh sửa HS? -->
  <text x="1060" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#000000">Loại thao tác?</text>
  <polygon points="1060,115 1080,130 1060,145 1040,130" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />

  <!-- Box: Sửa/Khóa HS -->
  <rect x="950" y="170" width="90" height="45" rx="5" ry="5" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="995" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000">
    <tspan x="995" dy="0">Sửa thông tin</tspan>
    <tspan x="995" dy="13">hoặc Khóa HS</tspan>
  </text>

  <!-- Box: Xóa Học sinh -->
  <rect x="1080" y="170" width="90" height="45" rx="5" ry="5" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="1125" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000">
    <tspan x="1125" dy="0">Yêu cầu xóa HS</tspan>
    <tspan x="1125" dy="13">&amp; Nhập lý do</tspan>
  </text>


  <!-- ==================== LANE 2: HỆ THỐNG (y: 340 to 730) ==================== -->

  <!-- === SYSTEM COLUMN 1 === -->
  <!-- Box: Hệ thống tạo tài khoản chung -->
  <rect x="80" y="380" width="100" height="50" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="130" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
    <tspan x="130" dy="0">Tạo tài khoản &amp;</tspan>
    <tspan x="130" dy="15">gán vai trò trong DB</tspan>
  </text>

  <!-- Box: Hệ thống cập nhật tài khoản chung -->
  <rect x="210" y="380" width="100" height="50" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="260" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
    <tspan x="260" dy="0">Cập nhật vai trò</tspan>
    <tspan x="260" dy="15">hoặc Xóa khỏi DB</tspan>
  </text>

  <!-- === SYSTEM COLUMN 2 === -->
  <!-- Box: Tạo GV, gán lớp & môn -->
  <rect x="330" y="380" width="120" height="55" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="390" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
    <tspan x="390" dy="0">Sinh mã GV000x,</tspan>
    <tspan x="390" dy="15">Tạo tài khoản &amp;</tspan>
    <tspan x="390" dy="15">Lưu phân công</tspan>
  </text>

  <!-- Box: Cập nhật GV / Toggle Active -->
  <rect x="470" y="380" width="120" height="55" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="530" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
    <tspan x="530" dy="0">Cập nhật thông tin</tspan>
    <tspan x="530" dy="15">hoặc đổi trạng thái</tspan>
    <tspan x="530" dy="15">IsActive</tspan>
  </text>

  <!-- Box: Xóa Giáo viên sạch -->
  <rect x="610" y="380" width="120" height="55" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="670" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
    <tspan x="670" dy="0">Xóa lịch dạy, môn,</tspan>
    <tspan x="670" dy="15">lớp chủ nhiệm &amp;</tspan>
    <tspan x="670" dy="15">xóa tài khoản</tspan>
  </text>

  <!-- === SYSTEM COLUMN 3 === -->
  <!-- Box: Tự sinh mã HS -->
  <rect x="760" y="380" width="140" height="50" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="830" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
    <tspan x="830" dy="0">Tự sinh mã Học sinh</tspan>
    <tspan x="830" dy="15">(Năm + LớpCode + STT)</tspan>
  </text>

  <!-- Box: Khởi tạo bảng điểm rỗng -->
  <rect x="760" y="470" width="140" height="55" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="830" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
    <tspan x="830" dy="0">Tạo tài khoản HS &amp;</tspan>
    <tspan x="830" dy="15">Khởi tạo bảng điểm</tspan>
    <tspan x="830" dy="15">rỗng HK1 &amp; HK2</tspan>
  </text>

  <!-- Box: Cập nhật HS / Toggle Active -->
  <rect x="925" y="380" width="140" height="50" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="995" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
    <tspan x="995" dy="0">Cập nhật thông tin</tspan>
    <tspan x="995" dy="15">hoặc Toggle IsActive</tspan>
  </text>

  <!-- Box: Sao lưu thông tin xóa -->
  <rect x="1080" y="380" width="140" height="50" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="1150" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
    <tspan x="1150" dy="0">Sao lưu điểm &amp;</tspan>
    <tspan x="1150" dy="15">thông tin học sinh</tspan>
  </text>

  <!-- Box: Xóa HS sạch -->
  <rect x="1080" y="470" width="140" height="55" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="1150" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
    <tspan x="1150" dy="0">Xóa điểm, bài nộp</tspan>
    <tspan x="1150" dy="15">liên quan &amp; Xóa</tspan>
    <tspan x="1150" dy="15">tài khoản khỏi DB</tspan>
  </text>


  <!-- ==================== CONNECTIONS / FLOWS ==================== -->

  <!-- Start Node -> Chọn đối tượng -->
  <path d="M 100 70 L 150 70" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- ChooseRole -> Account Action Diamond -->
  <path d="M 170 85 L 170 125" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="175" y="102" font-family="Arial, sans-serif" font-size="9" fill="#1565C0" font-weight="bold">Tài khoản chung</text>

  <!-- ChooseRole -> Teacher Action Diamond -->
  <path d="M 190 70 L 485 70 L 485 125" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="330" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#1565C0" font-weight="bold">Giáo viên</text>

  <!-- ChooseRole -> Student Action Diamond -->
  <path d="M 170 55 L 170 35 L 945 35 L 945 80" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="780" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#1565C0" font-weight="bold">Học sinh</text>

  <!-- === FLOW COLUMN 1 === -->
  <!-- Account Action -> Tạo tài khoản -->
  <path d="M 150 140 L 130 140 L 130 180" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="140" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#555555">Tạo mới</text>

  <!-- Account Action -> Sửa/Xóa -->
  <path d="M 190 140 L 260 140 L 260 180" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="225" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#555555">Sửa/Xóa</text>

  <!-- Tạo tài khoản -> Hệ thống tạo tài khoản -->
  <path d="M 130 225 L 130 380" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Sửa/Xóa -> Hệ thống sửa/xóa -->
  <path d="M 260 225 L 260 380" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />


  <!-- === FLOW COLUMN 2 === -->
  <!-- Teacher Action -> Thêm Giáo viên -->
  <path d="M 465 140 L 390 140 L 390 180" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="425" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#555555">Thêm</text>

  <!-- Teacher Action -> Sửa/Khóa GV -->
  <path d="M 485 155 L 485 240" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="490" y="170" text-anchor="start" font-family="Arial, sans-serif" font-size="8.5" fill="#555555">Sửa/Khóa</text>

  <!-- Teacher Action -> Xóa GV -->
  <path d="M 505 140 L 580 140 L 580 180" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="545" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#555555">Xóa</text>

  <!-- Thêm GV -> Hệ thống Tạo GV -->
  <path d="M 390 225 L 390 380" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Sửa/Khóa GV -> Hệ thống Cập nhật GV -->
  <path d="M 485 285 L 485 380" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Xóa GV -> Hệ thống Xóa GV -->
  <path d="M 580 225 L 580 380" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />


  <!-- === FLOW COLUMN 3 === -->
  <!-- Student Action -> Thêm HS -->
  <path d="M 925 95 L 830 95 L 830 115" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="875" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#555555">Thêm</text>

  <!-- Student Action -> Sửa/Xóa/Khóa HS -->
  <path d="M 965 95 L 1060 95 L 1060 115" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="1015" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#555555">Sửa/Xóa/Khóa</text>

  <!-- Thêm HS Method -> Thủ công -->
  <path d="M 810 130 L 765 130 L 765 170" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="785" y="123" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#555555">Thủ công</text>

  <!-- Thêm HS Method -> Excel -->
  <path d="M 850 130 L 895 130 L 895 170" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="875" y="123" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#555555">Excel</text>

  <!-- Sửa/Xóa/Khóa HS -> Sửa/Khóa -->
  <path d="M 1040 130 L 995 130 L 995 170" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="1015" y="123" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#555555">Sửa/Khóa</text>

  <!-- Sửa/Xóa/Khóa HS -> Xóa -->
  <path d="M 1080 130 L 1125 130 L 1125 170" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="1105" y="123" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#555555">Xóa</text>

  <!-- Merge paths from "Thêm thủ công" and "Import Excel" -->
  <path d="M 765 215 L 765 250 L 830 250" fill="none" stroke="#333333" stroke-width="1.2" />
  <path d="M 895 215 L 895 250 L 830 250" fill="none" stroke="#333333" stroke-width="1.2" />
  <path d="M 830 250 L 830 380" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Tự sinh mã HS -> Khởi tạo điểm rỗng -->
  <path d="M 830 430 L 830 470" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Sửa / Khóa HS -> Cập nhật HS -->
  <path d="M 995 215 L 995 380" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Xóa Học sinh -> Sao lưu điểm -->
  <path d="M 1125 215 L 1125 380" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Sao lưu điểm -> Xóa điểm & HS sạch -->
  <path d="M 1150 430 L 1150 470" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />


  <!-- ==================== COLLECTOR & END NODE ==================== -->
  
  <!-- Vertical collector lines straight down to y=640 -->
  <path d="M 130 430 L 130 637" fill="none" stroke="#333333" stroke-width="1.2" />
  <path d="M 260 430 L 260 637" fill="none" stroke="#333333" stroke-width="1.2" />
  <path d="M 390 435 L 390 637" fill="none" stroke="#333333" stroke-width="1.2" />
  <path d="M 530 435 L 530 637" fill="none" stroke="#333333" stroke-width="1.2" />
  <path d="M 670 435 L 670 637" fill="none" stroke="#333333" stroke-width="1.2" />
  <path d="M 830 525 L 830 637" fill="none" stroke="#333333" stroke-width="1.2" />
  <path d="M 995 430 L 995 637" fill="none" stroke="#333333" stroke-width="1.2" />
  <path d="M 1150 525 L 1150 637" fill="none" stroke="#333333" stroke-width="1.2" />

  <!-- Horizontal collector line - UML JOIN BAR (Bold/Thick Black Bar) -->
  <line x1="120" y1="640" x2="1160" y2="640" stroke="#000000" stroke-width="6" stroke-linecap="round" />

  <!-- Connector from collector line back to End Node (uses clear corridor at x=325) -->
  <path d="M 325 637 L 325 320" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

</svg>
