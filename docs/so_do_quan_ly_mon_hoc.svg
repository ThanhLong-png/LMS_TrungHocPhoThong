<svg xmlns="http://www.w3.org/2000/svg" width="850" height="680" viewBox="0 0 850 680">
  <defs>
    <!-- Arrow marker definition -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333" />
    </marker>
  </defs>

  <!-- Outer frame with rounded corners -->
  <rect x="10" y="10" width="830" height="660" rx="15" ry="15" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" />

  <!-- Yellow vertical header column on the left -->
  <path d="M 60 10 L 25 10 A 15 15 0 0 0 10 25 L 10 655 A 15 15 0 0 0 25 670 L 60 670 Z" fill="#FFF9C4" stroke="#333333" stroke-width="1.5" />

  <!-- Horizontal division lines for swimlanes -->
  <line x1="10" y1="310" x2="840" y2="310" stroke="#333333" stroke-width="1.5" />

  <!-- Vertical text labels inside the yellow header column -->
  <text transform="rotate(-90, 35, 160)" x="35" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333333" font-weight="bold">Admin</text>
  <text transform="rotate(-90, 35, 490)" x="35" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333333" font-weight="bold">Hệ thống</text>

  <!-- ==================== LANE 1: ADMIN (y: 10 to 310) ==================== -->
  
  <!-- Start Node (Black circle) -->
  <circle cx="80" cy="100" r="10" fill="#000000" />

  <!-- ChooseAction Decision Diamond -->
  <text x="160" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000">Chọn chức năng?</text>
  <polygon points="160,85 180,100 160,115 140,100" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />

  <!-- Box 1: Nhập tên môn & chọn Khối -->
  <rect x="240" y="75" width="160" height="50" rx="5" ry="5" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="320" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000">
    <tspan x="320" dy="0">Nhập tên môn học</tspan>
    <tspan x="320" dy="15">&amp; chọn Khối</tspan>
  </text>

  <!-- Box 2: Chọn GV & các Lớp học -->
  <rect x="440" y="75" width="160" height="50" rx="5" ry="5" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="520" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000">
    <tspan x="520" dy="0">Chọn Giáo viên</tspan>
    <tspan x="520" dy="15">&amp; các Lớp học</tspan>
  </text>

  <!-- Box 3: Yêu cầu xóa môn học -->
  <rect x="640" y="75" width="160" height="50" rx="5" ry="5" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="720" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000">Yêu cầu xóa môn học</text>

  <!-- End Node (Black circle with outer border) -->
  <circle cx="80" cy="240" r="10" fill="#000000" />
  <circle cx="80" cy="240" r="15" fill="none" stroke="#000000" stroke-width="1.5" />

  <!-- ==================== LANE 2: HỆ THỐNG (y: 310 to 670) ==================== -->

  <!-- Diamond 1: Môn đã tồn tại? -->
  <text x="320" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#000000">Đã tồn tại trong Khối?</text>
  <polygon points="320,360 345,380 320,400 295,380" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />

  <!-- ShowErrorSub: Hiển thị báo lỗi trùng lặp -->
  <rect x="110" y="355" width="150" height="50" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="185" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0d47a1">
    <tspan x="185" dy="0">Hiển thị báo lỗi</tspan>
    <tspan x="185" dy="15">trùng lặp</tspan>
  </text>

  <!-- SaveNewSub: Lưu môn học (IsActive = true) -->
  <rect x="240" y="490" width="160" height="50" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="320" y="513" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0d47a1">
    <tspan x="320" dy="0">Lưu môn học mới</tspan>
    <tspan x="320" dy="15">(IsActive = true)</tspan>
  </text>

  <!-- Diamond 2: Lớp đã có GV? -->
  <text x="520" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#000000">Lớp đã có GV môn này?</text>
  <polygon points="520,360 545,380 520,400 495,380" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />

  <!-- SaveAssign: Tạo phân công & Cập nhật Lịch -->
  <rect x="440" y="490" width="160" height="50" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="520" y="513" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0d47a1">
    <tspan x="520" dy="0">Tạo phân công</tspan>
    <tspan x="520" dy="15">&amp; Cập nhật Lịch học</tspan>
  </text>

  <!-- ShowWarningAssign: Cảnh báo & Bỏ qua lớp -->
  <rect x="440" y="580" width="160" height="50" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="520" y="603" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0d47a1">
    <tspan x="520" dy="0">Hiển thị cảnh báo</tspan>
    <tspan x="520" dy="15">&amp; bỏ qua lớp đó</tspan>
  </text>

  <!-- Diamond 3: Còn GV phụ trách? -->
  <text x="720" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#000000">Còn GV phụ trách?</text>
  <polygon points="720,360 745,380 720,400 695,380" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />

  <!-- ShowErrorDelete: Báo lỗi không thể xóa -->
  <rect x="640" y="490" width="160" height="50" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="720" y="513" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0d47a1">
    <tspan x="720" dy="0">Hiển thị báo lỗi</tspan>
    <tspan x="720" dy="15">không thể xóa</tspan>
  </text>

  <!-- SoftDeleteSub: Soft-delete (IsActive = false) -->
  <rect x="640" y="580" width="160" height="50" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="720" y="603" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0d47a1">
    <tspan x="720" dy="0">Đặt IsActive = false</tspan>
    <tspan x="720" dy="15">(Soft-delete)</tspan>
  </text>

  <!-- ==================== CONNECTIONS / FLOWS ==================== -->

  <!-- Start -> Chọn chức năng -->
  <path d="M 90 100 L 140 100" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Branch 1 (Thêm môn): Horizontal straight line from right point of diamond -->
  <path d="M 180 100 L 240 100" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="210" y="93" font-family="Arial, sans-serif" font-size="8.5" fill="#555555" font-weight="bold" text-anchor="middle">Thêm môn</text>

  <!-- Branch 2 (Phân công GV): Separate line going up to y=45 then right -->
  <path d="M 160 85 L 160 45 L 520 45 L 520 75" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="450" y="38" font-family="Arial, sans-serif" font-size="8.5" fill="#555555" font-weight="bold">Phân công GV</text>

  <!-- Branch 3 (Xóa môn): Separate line going up to y=30 then right -->
  <path d="M 160 85 L 160 30 L 720 30 L 720 75" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="655" y="24" font-family="Arial, sans-serif" font-size="8.5" fill="#555555" font-weight="bold">Xóa môn học</text>

  <!-- === BRANCH 1: CREATE === -->
  <!-- Box 1 -> Diamond 1 -->
  <path d="M 320 125 L 320 360" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Diamond 1 -> Đúng -> ShowErrorSub -->
  <path d="M 295 380 L 260 380" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="278" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#C62828" font-weight="bold">Đúng</text>

  <!-- ShowErrorSub -> Loop back to Box 1 -->
  <path d="M 185 355 L 185 100 L 240 100" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Diamond 1 -> Sai -> SaveNewSub -->
  <path d="M 320 400 L 320 490" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="325" y="440" text-anchor="start" font-family="Arial, sans-serif" font-size="9.5" fill="#2E7D32" font-weight="bold">Sai</text>

  <!-- === BRANCH 2: ASSIGN === -->
  <!-- Box 2 -> Diamond 2 -->
  <path d="M 520 125 L 520 360" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Diamond 2 -> Sai -> SaveAssign -->
  <path d="M 520 400 L 520 490" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="525" y="440" text-anchor="start" font-family="Arial, sans-serif" font-size="9.5" fill="#2E7D32" font-weight="bold">Sai</text>

  <!-- Diamond 2 -> Đúng -> ShowWarningAssign -->
  <path d="M 545 380 L 610 380 L 610 605 L 600 605" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="580" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#C62828" font-weight="bold">Đúng</text>

  <!-- ShowWarningAssign -> Loop back to Box 2 (using corridor x=430 to avoid crossing boxes) -->
  <path d="M 440 605 L 430 605 L 430 100 L 440 100" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- === BRANCH 3: DELETE === -->
  <!-- Box 3 -> Diamond 3 -->
  <path d="M 720 125 L 720 360" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Diamond 3 -> Đúng -> ShowErrorDelete -->
  <path d="M 720 400 L 720 490" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="725" y="440" text-anchor="start" font-family="Arial, sans-serif" font-size="9.5" fill="#C62828" font-weight="bold">Đúng</text>

  <!-- Diamond 3 -> Sai -> SoftDeleteSub -->
  <path d="M 745 380 L 815 380 L 815 605 L 800 605" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="780" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#2E7D32" font-weight="bold">Sai</text>

  <!-- ==================== COLLECTOR & END NODE ==================== -->
  <!-- Collector line below system boxes (x=320, x=415, x=625, x=720) -->
  <path d="M 320 540 L 320 642" fill="none" stroke="#333333" stroke-width="1.2" />
  
  <!-- Route SaveAssign to collector around ShowWarningAssign box (via corridor x=415) -->
  <path d="M 520 540 L 520 560 L 415 560 L 415 642" fill="none" stroke="#333333" stroke-width="1.2" />
  
  <!-- Route ShowErrorDelete to collector through empty space x=625 -->
  <path d="M 640 515 L 625 515 L 625 642" fill="none" stroke="#333333" stroke-width="1.2" />

  <!-- Route SoftDeleteSub to collector -->
  <path d="M 720 630 L 720 642" fill="none" stroke="#333333" stroke-width="1.2" />

  <!-- Horizontal collector line - UML JOIN BAR (Bold/Thick Black Bar) -->
  <line x1="310" y1="645" x2="730" y2="645" stroke="#000000" stroke-width="6" stroke-linecap="round" />

  <!-- Collector to End Node (completely clear on the left side) -->
  <path d="M 310 645 L 80 645 L 80 255" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
</svg>
