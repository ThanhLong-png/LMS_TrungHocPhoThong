<svg xmlns="http://www.w3.org/2000/svg" width="820" height="660" viewBox="0 0 820 660">
  <defs>
    <!-- Arrow marker definition -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333" />
    </marker>
  </defs>

  <!-- Outer frame with rounded corners -->
  <rect x="10" y="10" width="800" height="640" rx="15" ry="15" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" />

  <!-- Yellow vertical header column on the left -->
  <path d="M 60 10 L 25 10 A 15 15 0 0 0 10 25 L 10 635 A 15 15 0 0 0 25 650 L 60 650 Z" fill="#FFF9C4" stroke="#333333" stroke-width="1.5" />

  <!-- Horizontal division lines for swimlanes -->
  <line x1="10" y1="210" x2="810" y2="210" stroke="#333333" stroke-width="1.5" />
  <line x1="10" y1="430" x2="810" y2="430" stroke="#333333" stroke-width="1.5" />

  <!-- Vertical text labels inside the yellow header column -->
  <text transform="rotate(-90, 35, 110)" x="35" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333" font-weight="bold">Giáo viên</text>
  <text transform="rotate(-90, 35, 320)" x="35" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333" font-weight="bold">Học sinh</text>
  <text transform="rotate(-90, 35, 540)" x="35" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333333" font-weight="bold">Hệ thống</text>

  <!-- ==================== LANE 1: GIÁO VIÊN (y: 10 to 210) ==================== -->
  
  <!-- Start Node (Black circle) -->
  <circle cx="120" cy="50" r="10" fill="#000000" />

  <!-- Diamond: Chọn hành động? -->
  <polygon points="180,40 195,50 180,60 165,50" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="180" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#000000">Chọn hành động?</text>

  <!-- Box 1: Tạo bài tập & đặt hạn nộp -->
  <rect x="110" y="90" width="150" height="45" rx="5" ry="5" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="185" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000">
    <tspan x="185" dy="0">Tạo bài tập &amp;</tspan>
    <tspan x="185" dy="13">thiết lập hạn nộp</tspan>
  </text>

  <!-- Box 2: Xem danh sách bài nộp -->
  <rect x="480" y="90" width="150" height="45" rx="5" ry="5" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="555" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000">
    <tspan x="555" dy="0">Xem danh sách</tspan>
    <tspan x="555" dy="13">bài nộp của HS</tspan>
  </text>


  <!-- ==================== LANE 2: HỌC SINH (y: 210 to 430) ==================== -->

  <!-- Start Node (Black circle) -->
  <circle cx="120" cy="250" r="10" fill="#000000" />

  <!-- Box 1: Làm & Tải lên bài làm -->
  <rect x="290" y="280" width="150" height="45" rx="5" ry="5" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="365" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000">
    <tspan x="365" dy="0">Làm bài &amp; Tải lên</tspan>
    <tspan x="365" dy="13">bài làm (File/Nội dung)</tspan>
  </text>

  <!-- Box 2: Hiển thị báo lỗi -->
  <rect x="480" y="340" width="150" height="45" rx="5" ry="5" fill="#FFF59D" stroke="#FBC02D" stroke-width="1.5" />
  <text x="555" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000000">
    <tspan x="555" dy="0">Hiển thị báo lỗi</tspan>
    <tspan x="555" dy="13">định dạng / dung lượng</tspan>
  </text>

  <!-- End Node (Black circle with outer border) -->
  <circle cx="740" cy="330" r="10" fill="#000000" />
  <circle cx="740" cy="330" r="15" fill="none" stroke="#000000" stroke-width="1.5" />


  <!-- ==================== LANE 3: HỆ THỐNG (y: 430 to 650) ==================== -->

  <!-- Box 1: Tạo bài tập & mở cổng -->
  <rect x="110" y="460" width="150" height="45" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="185" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
    <tspan x="185" dy="0">Tạo bài tập &amp;</tspan>
    <tspan x="185" dy="13">mở cổng tiếp nhận</tspan>
  </text>

  <!-- Diamond 1: Hợp lệ? (<20MB, allowed type) -->
  <polygon points="365,460 380,480 365,500 350,480" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="390" y="484" text-anchor="start" font-family="Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#000000">Hợp lệ? (&lt;20MB)</text>

  <!-- Box 2: Lưu bài làm & tính hạn nộp -->
  <rect x="290" y="560" width="150" height="45" rx="5" ry="5" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.5" />
  <text x="365" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
    <tspan x="365" dy="0">Lưu bài, tính hạn nộp</tspan>
    <tspan x="365" dy="13">(Đúng hạn / Nộp trễ)</tspan>
  </text>


  <!-- ==================== CONNECTIONS / FLOWS ==================== -->

  <!-- Giáo viên Start to Diamond -->
  <path d="M 130 50 L 165 50" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Giáo viên Diamond to Box 1 -->
  <path d="M 180 60 L 180 90" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="184" y="78" font-family="Arial, sans-serif" font-size="8.5" fill="#1565C0" font-weight="bold">Tạo bài</text>

  <!-- Giáo viên Diamond to Box 2 -->
  <path d="M 195 50 L 555 50 L 555 90" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="375" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" fill="#1565C0" font-weight="bold">Xem bài nộp</text>


  <!-- Học sinh Start to Box 1 -->
  <path d="M 130 250 L 220 250 L 220 302 L 290 302" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />


  <!-- GV Box 1 -> Hệ thống Box 1 -->
  <path d="M 185 135 L 185 460" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

  <!-- Hệ thống Box 1 -> HS Box 1 -->
  <path d="M 185 505 L 185 520 L 270 520 L 270 302 L 290 302" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />


  <!-- HS Box 1 -> System Diamond -->
  <path d="M 365 325 L 365 460" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />


  <!-- Diamond -> HS Box 2 (Sai) -->
  <path d="M 365 460 L 365 440 L 555 440 L 555 385" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="460" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#C62828" font-weight="bold">Sai</text>

  <!-- HS Box 2 (Loop back to HS Box 1) -->
  <path d="M 555 340 L 555 320 L 440 320" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />


  <!-- Diamond -> System Box 2 (Đúng) -->
  <path d="M 365 500 L 365 560" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />
  <text x="372" y="530" text-anchor="start" font-family="Arial, sans-serif" font-size="9.5" fill="#2E7D32" font-weight="bold">Đúng</text>


  <!-- System Box 2 -> GV Box 2 (via right corridor x=650 to avoid crossing HS Box 2) -->
  <path d="M 365 605 L 365 615 L 650 615 L 650 150 L 555 150 L 555 135" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />


  <!-- ==================== COLLECTOR & END NODE ==================== -->
  
  <!-- System Box 1 to Join Bar -->
  <path d="M 185 505 L 185 632" fill="none" stroke="#333333" stroke-width="1.2" />

  <!-- GV Box 2 to Join Bar (via corridor x=670) -->
  <path d="M 630 112 L 670 112 L 670 632" fill="none" stroke="#333333" stroke-width="1.2" />

  <!-- Join Bar (Moved down to y=635 to avoid overlaying System Box 2) -->
  <line x1="150" y1="635" x2="700" y2="635" stroke="#000000" stroke-width="6" stroke-linecap="round" />

  <!-- Join Bar to End Node -->
  <path d="M 700 635 L 740 635 L 740 345" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)" />

</svg>
